name: Folio Android CI

on:
  push:
    branches:
      - main
      - "folio/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android API 37
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Verify project and dependencies
        run: >
          ./gradlew --no-daemon --stacktrace
          verifyAccessibilityLocalization
          verifyAndroidUpgradeReadiness
          verifyDependencyProvenance
          verifyExportedSurfaceSmoke

      - name: Run unit tests and assemble debug
        run: >
          ./gradlew --no-daemon --stacktrace
          test
          :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
