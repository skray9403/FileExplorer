name: Folio Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: folio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 37 SDK platform and tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run verification and build debug APK
        run: >-
          ./gradlew testDebugUnitTest lintDebug verifyAccessibilityLocalization
          verifyAndroidUpgradeReadiness assembleDebug --stacktrace
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
